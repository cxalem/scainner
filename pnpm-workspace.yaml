packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
# pnpm's minimum-release-age supply-chain gate blocks packages published too
# recently; these just-released Expo SDK 57 versions are allowlisted so
# apps/mobile can install. Exact-pinned: extend this list (or remove it once
# the versions age past the gate) when bumping Expo.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.17'
  - '@expo/fingerprint@0.20.9'
  - '@expo/local-build-cache-provider@57.0.7'
  - '@expo/metro-config@57.0.9'
  - '@expo/prebuild-config@57.0.13'
  - '@expo/router-server@57.0.7'
  - expo-asset@57.0.13
  - expo-constants@57.0.13
  - expo-file-system@57.0.5
  - expo-modules-core@57.0.12
  - expo-modules-jsi@57.0.5
  - expo@57.0.15
