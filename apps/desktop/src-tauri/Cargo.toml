[package]
name = "scainner"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scainner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
libc = "0.2.189"
tauri-plugin-notification = "2.3.3"
log = "0.4.33"
env_logger = "0.11.11"
# The auto-updater (product-plan.md's 2026-08-21 decision: ship over GitHub
# Releases, not a self-hosted server). tauri-plugin-process supplies the
# relaunch() the frontend calls after a downloaded update installs — without
# it the user would have to quit and reopen the app by hand.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Client-generated cloud ids (schema v3): every syncable row gets a uuid at
# creation that becomes its Postgres primary key, making sync pushes
# idempotent/retry-safe (docs/workflows/data-core/plan.md, sync section).
uuid = { version = "1", features = ["v4"] }
# The embedded agent API (docs/api.md): an HTTP/JSON server in the SAME
# process as the Tauri app so it shares the one serial connection, the
# supervisor and the SQLite handle. tokio is already in the tree via Tauri;
# the explicit features are what axum's listener and the event relay need.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

