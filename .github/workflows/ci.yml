name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript · typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck every workspace
        run: pnpm typecheck

      - name: Test every workspace
        run: pnpm test

      - name: Build every workspace
        run: pnpm build

  brand-tokens:
    name: Lint · repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Brand tokens must not grow beyond scripts/brand_token_baseline.json
        run: python3 scripts/lint_brand_tokens.py

      - name: Workspaces must remain private and proprietary
        run: python3 scripts/lint_proprietary_license.py

  rust:
    name: Rust · format, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            wget \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        # Clippy currently reports pre-existing maintainability warnings.
        # Keep it visible now; ratchet to `-D warnings` once that backlog is
        # cleared so introducing CI does not make the baseline permanently red.
        run: cargo clippy --locked --all-targets --all-features

      - name: Run tests
        run: cargo test --locked --all-targets --all-features
